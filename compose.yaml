services:
  www:
    build: .
    container_name: cinephoria_php
    restart: always
    environment:
      HTTP_PORT: 8080
      SERVER_NAME: ":80"
    ports:
      - '8080:80'
    networks:
      - cinephoria_net

  mariadb:
    image: mariadb:11.7-noble
    container_name: cinephoria_mariadb
    volumes:
      - ./db/mariadb_data:/var/lib/mysql
    environment:
      MARIADB_USER: cinephoria_db_user
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
      MARIADB_DATABASE: cinephoria
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    ports:
      - '33306:3306'
    networks:
      - cinephoria_net
    secrets:
      - db_root_password
      - db_password

  mongodb:
    image: mongo:8-noble
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./db/mongodb_data:/var/lib/mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets:
      - db_root_password
    networks:
      - cinephoria_net



  phpmyadmin:
#    image: phpmyadmin
    image: beeyev/phpmyadmin-lightweight:latest
    container_name: cinephoria_phpmyadmin
    depends_on:
      - mariadb
    ports:
      - '8780:80'
    networks:
      - cinephoria_net
    environment:
      PMA_HOST: mariadb

networks:
  cinephoria_net:

secrets:
   db_password:
     file: ./secrets/db_password.txt
   db_root_password:
     file: ./secrets/db_root_password.txt
